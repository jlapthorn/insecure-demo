# App 7: Old Node.js app with prototype pollution and other CVEs
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vuln-node
  namespace: insecure-demo
  labels:
    app: vuln-node
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vuln-node
  template:
    metadata:
      labels:
        app: vuln-node
    spec:
      containers:
      - name: node
        image: docker.io/node:10-slim
        command: ["node", "-e", "require('http').createServer((req,res)=>{res.end('vulnerable node app')}).listen(3000)"]
        ports:
        - containerPort: 3000
        securityContext:
          runAsUser: 0
          readOnlyRootFilesystem: false
          allowPrivilegeEscalation: true
---
