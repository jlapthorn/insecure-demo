apiVersion: v1
kind: Namespace
metadata:
  name: insecure-demo
  labels:
    app: vulnerable-demo
---
# App 4: Old Tomcat with many CVEs (Ghostcat, RCE, path traversal)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vuln-spring4shell
  namespace: insecure-demo
  labels:
    app: vuln-spring4shell
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vuln-spring4shell
  template:
    metadata:
      labels:
        app: vuln-spring4shell
    spec:
      containers:
      - name: spring
        image: docker.io/library/tomcat:8.5.0
        ports:
        - containerPort: 8080
        securityContext:
          runAsUser: 0
          readOnlyRootFilesystem: false
          allowPrivilegeEscalation: true
---
apiVersion: v1
kind: Service
metadata:
  name: vuln-spring4shell-svc
  namespace: insecure-demo
spec:
  selector:
    app: vuln-spring4shell
  ports:
  - port: 8080
    targetPort: 8080
---
