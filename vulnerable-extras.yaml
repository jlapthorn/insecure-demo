# App 10: Old Python/Flask with Jinja2 SSTI potential
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vuln-python
  namespace: insecure-demo
  labels:
    app: vuln-python
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vuln-python
  template:
    metadata:
      labels:
        app: vuln-python
    spec:
      containers:
      - name: python
        image: docker.io/python:2.7-slim
        command: ["python", "-m", "SimpleHTTPServer", "8000"]
        ports:
        - containerPort: 8000
        securityContext:
          runAsUser: 0
          readOnlyRootFilesystem: false
        env:
        - name: SECRET_KEY
          value: "changeme-this-is-insecure"
        - name: AWS_SECRET_ACCESS_KEY
          value: "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"
---
# App 11: Old MySQL with weak root password
