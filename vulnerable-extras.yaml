# App 6: Old PostgreSQL with default credentials in env vars
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vuln-postgres
  namespace: insecure-demo
  labels:
    app: vuln-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vuln-postgres
  template:
    metadata:
      labels:
        app: vuln-postgres
    spec:
      containers:
      - name: postgres
        image: docker.io/postgres:9.6
        ports:
