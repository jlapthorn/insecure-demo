---
# App 12: Crypto miner lookalike - triggers runtime/process policies
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vuln-miner
  namespace: insecure-demo
  labels:
    app: vuln-miner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vuln-miner
  template:
    metadata:
      labels:
        app: vuln-miner
    spec:
      containers:
      - name: miner
        image: docker.io/ubuntu:18.04
        command:
        - /bin/bash
        - -c
        - |
          apt-get update && apt-get install -y curl netcat &&
          while true; do echo "mining..."; sleep 60; done
        ports:
        - containerPort: 3333
          name: stratum
        securityContext:
          runAsUser: 0
          readOnlyRootFilesystem: false
          allowPrivilegeEscalation: true
        env:
        - name: MINING_POOL
          value: "stratum+tcp://pool.example.com:3333"
        - name: WALLET_ADDRESS
          value: "0xdeadbeef1234567890"
---
# App 13: Privileged pod with kubectl - RBAC abuse scenario
apiVersion: v1
kind: ServiceAccount
metadata:
  name: overprivileged-sa
  namespace: insecure-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: insecure-demo-cluster-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
- kind: ServiceAccount
  name: overprivileged-sa
  namespace: insecure-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vuln-kubectl
  namespace: insecure-demo
  labels:
    app: vuln-kubectl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vuln-kubectl
  template:
    metadata:
      labels:
        app: vuln-kubectl
    spec:
      serviceAccountName: overprivileged-sa
      automountServiceAccountToken: true
      containers:
      - name: kubectl
        image: docker.io/alpine:3.14
        command: ["sleep", "infinity"]
        securityContext:
          runAsUser: 0
          readOnlyRootFilesystem: false
